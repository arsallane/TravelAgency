trigger:
  branches:
    include:
      - main
          

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
    displayName: 'Install .NET 10 SDK'

  - script: |
      dotnet restore
      dotnet build -c Release
      dotnet test -c Release --no-build
    displayName: 'Restore, Build, Test casess and  Run Tests'
    
  # 🚀 Deploy to Azure App Service (test prod slot)
  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service (staging)'
    inputs:
      azureSubscription: 'github.com_arsallane1'
      appName: 'ChihadeTravelAgency'
      resourceGroupName: 'appgroup'
      slotName: 'production'
      package: '$(System.DefaultWorkingDirectory)/**/publish/*.zip'

